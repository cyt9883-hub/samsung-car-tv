<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#c{margin:0;height:100%;background:transparent;overflow:hidden}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><div id="c"></div><script>var _carAnim;
function initCar(el){
  cancelAnimationFrame(_carAnim);

  box(.3,.25,1.9,0x1a1d22,2.45,.45,0);box(.3,.25,1.9,0x1a1d22,-2.45,.45,0);
  [[1.5,.95],[1.5,-.95],[-1.3,.95],[-1.3,-.95]].forEach(function(w){
    var t=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.32,28),M(0x111111,{shininess:10}));t.rotation.x=Math.PI/2;t.position.set(w[0],.43,w[1]);g.add(t);

  addEventListener("pointermove",function(e){if(drag){g.rotation.y+=(e.clientX-lx)*.01;lx=e.clientX}});
